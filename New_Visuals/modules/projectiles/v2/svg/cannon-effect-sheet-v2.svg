<svg xmlns="http://www.w3.org/2000/svg" width="256" height="64" viewBox="0 0 256 64"><title>Auto Cannon hot tracer</title><desc>Horizontal editable flipbook. 4 frames, each 64 by 64. Runtime supplies movement, scale and timing.</desc><defs>
