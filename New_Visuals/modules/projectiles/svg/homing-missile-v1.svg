<svg xmlns="http://www.w3.org/2000/svg" width="64" height="128" viewBox="0 0 64 128">
  <title>Missile Pod — homing missile</title>
  <desc>Upward pale missile with the red nose of the parent module and a short warm exhaust.</desc>
  <defs>
    <linearGradient id="exhaust" x1="0" y1="75" x2="0" y2="118" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff5ba"/><stop offset=".35" stop-color="#ffcf65" stop-opacity=".8"/><stop offset="1" stop-color="#ff9c4f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="body" x1="24" y1="0" x2="40" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9baab3"/><stop offset=".4" stop-color="#f4f6f5"/><stop offset="1" stop-color="#b9c6cb"/>
    </linearGradient>
  </defs>
  <g id="engine-flame"><path d="M25 76H39Q41 91 32 118 23 91 25 76" fill="url(#exhaust)"/><path d="M29 76H35L32 100Z" fill="#fff8da"/></g>
  <g id="airframe" stroke="#293640" stroke-width="2.5" stroke-linejoin="round">
    <path d="M25 52 15 69V81L27 74M39 52 49 69V81L37 74" fill="#c3d0d5"/>
    <path d="M24 34 32 12 40 34V73L36 80H28L24 73Z" fill="url(#body)"/>
    <path d="M24 34 32 12 40 34Z" fill="#d76563"/>
    <path d="M25 71H39L36 80H28Z" fill="#52606a"/>
  </g>
  <path id="nose-highlight" d="M32 19 28 31" stroke="#ffaaa0" stroke-width="2.5" stroke-linecap="round"/>
  <path id="body-highlight" d="M28 40V64" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
</svg>
