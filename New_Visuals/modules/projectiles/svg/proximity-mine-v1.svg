<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <title>Mine Layer — proximity mine</title>
  <desc>Graphite puck, pale armor rim and one amber armed indicator, matching the exposed mine in its parent module.</desc>
  <defs>
    <linearGradient id="rim" x1="0" y1="23" x2="0" y2="73" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e4ecee"/><stop offset="1" stop-color="#82929d"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="29" x2="0" y2="65" gradientUnits="userSpaceOnUse">
      <stop stop-color="#52616d"/><stop offset="1" stop-color="#303c47"/>
    </linearGradient>
  </defs>
  <g id="mine-shell" stroke="#222e38" stroke-width="3">
    <circle cx="48" cy="48" r="25" fill="url(#rim)"/>
    <circle cx="48" cy="48" r="19" fill="url(#face)"/>
  </g>
  <path id="rim-highlight" d="M28 42A21 21 0 0 1 59 30" fill="none" stroke="#f4fbfd" stroke-width="2.5" stroke-linecap="round"/>
  <path id="cover-facet" d="M35 40 43 34H56L61 40H45L39 47H35Z" fill="#697986"/>
  <g id="armed-indicator"><circle cx="48" cy="52" r="6.5" fill="#232f38"/><circle cx="48" cy="52" r="4" fill="#ffc66c"/><path d="M46 50H49" stroke="#fff5d1" stroke-width="2" stroke-linecap="round"/></g>
</svg>
