<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>Gravity Well — pull field</title>
  <desc>Mostly transparent violet field, three inward curving streams and a small dark well. Boundary radius 104 around 128,128.</desc>
  <defs>
    <radialGradient id="well-halo"><stop stop-color="#c4a2ff" stop-opacity=".4"/><stop offset="1" stop-color="#a27cf0" stop-opacity="0"/></radialGradient>
    <radialGradient id="stream" cx="128" cy="128" r="104" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e0caff" stop-opacity=".7"/><stop offset=".25" stop-color="#d6baff" stop-opacity=".6"/><stop offset=".6" stop-color="#b49be9" stop-opacity=".25"/><stop offset="1" stop-color="#b49be9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g id="boundary" fill="none"><circle cx="128" cy="128" r="104" stroke="#ad8bdf" stroke-width="5" opacity=".08"/><circle cx="128" cy="128" r="104" stroke="#c8a2ff" stroke-width="1.5" opacity=".5"/></g>
  <g id="inward-streams" fill="url(#stream)">
    <path d="M39 105C47 57 103 39 143 63 177 83 180 122 151 143 143 149 133 150 125 147 145 147 161 133 162 116 164 90 143 72 119 68 89 63 58 77 39 105Z"/>
    <path d="M39 105C47 57 103 39 143 63 177 83 180 122 151 143 143 149 133 150 125 147 145 147 161 133 162 116 164 90 143 72 119 68 89 63 58 77 39 105Z" transform="rotate(120 128 128)"/>
    <path d="M39 105C47 57 103 39 143 63 177 83 180 122 151 143 143 149 133 150 125 147 145 147 161 133 162 116 164 90 143 72 119 68 89 63 58 77 39 105Z" transform="rotate(240 128 128)"/>
  </g>
  <g id="well"><circle cx="128" cy="128" r="27" fill="url(#well-halo)"/><circle cx="128" cy="128" r="10" fill="#171e32" stroke="#dcc4ff" stroke-width="2.5"/><path d="M123 122A8 8 0 0 1 135 126" fill="none" stroke="#f3eaff" stroke-width="1.5" stroke-linecap="round"/></g>
</svg>
